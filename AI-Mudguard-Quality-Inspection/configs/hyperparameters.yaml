# Phase 2 Advanced Hyperparameter Tuning Configuration

tuning_framework: "optuna"
num_trials: 50
optimization_metric: "mAP@0.5:0.95"
direction: "maximize"

search_space:
  learning_rate:
    type: "loguniform"
    low: 1e-5
    high: 1e-2
  
  weight_decay:
    type: "loguniform"
    low: 1e-6
    high: 1e-3

  batch_size:
    type: "categorical"
    choices: [8, 16, 32]
  
  optimizer:
    type: "categorical"
    choices: ["AdamW", "SGD"]

  focal_loss_gamma:
    type: "uniform"
    low: 1.5
    high: 3.0
    description: "Tuning Focal Loss to address hard negatives and class imbalance (FN-001)"

advanced_training:
  use_cosine_annealing: true
  warmup_epochs: 3
  early_stopping_patience: 10
